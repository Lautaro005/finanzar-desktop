[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finanzar-backend"
version = "0.2.0"
description = "Backend local de FinanzAR Desktop (FastAPI + SQLite + ChromaDB)"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "FinanzAR Desktop" }]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "httpx>=0.27.0",
  "chromadb>=1.0.0",
  "huggingface_hub>=0.34.0",
  "openpyxl>=3.1.5",
  "pymupdf>=1.24.0",
  "pillow>=10.4.0",
  "python-multipart>=0.0.12",
  "platformdirs>=4.3.0",
]

[project.optional-dependencies]
# El extra `ocr` habilita inferencia real con GLM-OCR (carga directa del modelo).
# Pesado: torch + torchvision + transformers. Sin él, la app usa el texto nativo
# del PDF y lo informa como motor `native-pymupdf`.
ocr = [
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "transformers>=5.0.0",
  "accelerate>=1.0.0",
  "safetensors>=0.4.5",
]
dev = [
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]

[project.scripts]
finanzar-backend = "finanzar_backend.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["finanzar_backend"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["build", "dist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
