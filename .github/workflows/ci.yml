name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Crear entorno e instalar
        working-directory: backend
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Ruff
        working-directory: backend
        run: uv run ruff check .
      - name: Pytest
        working-directory: backend
        run: uv run pytest -q

  frontend:
    name: Frontend (React/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck y build
        run: npm run build
      - name: Tests
        run: npm run test

  rust:
    name: Rust / Tauri (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 14 está deprecado por GitHub (brownouts desde el 2026-10-05 y
          # sin soporte desde el 2026-11-02): se usan las imágenes de macOS 15.
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `externalBin` exige que el sidecar exista; para lintear y testear
      # alcanza con un archivo presente.
      - name: Sidecar de prueba (externalBin)
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          printf '#!/bin/sh\nexit 0\n' > "src-tauri/binaries/finanzar-backend-${{ matrix.target }}${suffix}"
          chmod +x "src-tauri/binaries/finanzar-backend-${{ matrix.target }}${suffix}"

      - name: Placeholder de frontendDist
        shell: bash
        run: |
          mkdir -p dist
          printf '<!doctype html><title>CI</title>' > dist/index.html

      - name: fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: test
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.target }}
