name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Crear entorno e instalar
        working-directory: backend
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Ruff
        working-directory: backend
        run: uv run ruff check .
      - name: Pytest
        working-directory: backend
        run: uv run pytest -q

  frontend:
    name: Frontend (React/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        continue-on-error: false
      - name: Typecheck y build
        run: npm run build
      - name: Tests
        run: npm run test

  rust:
    name: Rust / Tauri (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Sidecar de prueba (para externalBin)
        run: |
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\nexit 0\n' > "src-tauri/binaries/finanzar-backend-${{ matrix.target }}"
          chmod +x "src-tauri/binaries/finanzar-backend-${{ matrix.target }}"
      - name: fmt
        working-directory: src-tauri
        run: cargo fmt --check --target ${{ matrix.target }}
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
      - name: test
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.target }}
