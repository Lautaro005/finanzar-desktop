name: Release Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 e Intel sobre macOS 15: la imagen de macOS 14 está
          # deprecada (brownouts desde el 2026-10-05, sin soporte desde el
          # 2026-11-02) y `macos-13` ya no existe, lo que dejaba el job en cola
          # para siempre y la release vacía.
          - { os: macos-15, target: aarch64-apple-darwin, bundles: "dmg,app" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, bundles: "dmg,app" }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: "appimage,deb" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: "nsis,msi" }
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev rpm file

      - name: Toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - run: npm ci

      - name: Sidecar del backend (PyInstaller)
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/build_backend.py ${{ matrix.target }}

      - name: Build de la app
        env:
          # La firma del updater es opcional: sin clave, el build sale sin .sig.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: finanzar-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: finanzar-*
          merge-multiple: true

      - name: Crear la release con los instaladores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/**/*.dmg artifacts/**/*.msi artifacts/**/*.exe \
                 artifacts/**/*.AppImage artifacts/**/*.deb \
                 artifacts/**/*.app.tar.gz artifacts/**/*.sig)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No hay artefactos para publicar"; exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "FinanzAR Desktop ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
