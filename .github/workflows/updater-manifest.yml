name: Updater manifest

on:
  workflow_run:
    workflows: ["Release Desktop"]
    types: [completed]

permissions:
  contents: write

jobs:
  manifest:
    name: Publicar latest.json
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar artefactos del release
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: finanzar-*
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir el manifiesto del updater
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/build_updater_manifest.py "$TAG" "$REPO" artifacts latest.json

      - name: Publicar el manifiesto en el release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -f latest.json ]; then
            gh release upload "$TAG" latest.json --clobber --repo "${GITHUB_REPOSITORY}"
          else
            echo "No se generó latest.json (faltan las firmas del updater)."
          fi
