[package]
name = "finanzar-desktop"
version = "0.2.7"
description = "FinanzAR Desktop — bóveda financiera local-first"
authors = ["FinanzAR Desktop"]
edition = "2021"
rust-version = "1.77"
license = "AGPL-3.0-only"
default-run = "finanzar-desktop"

[lib]
name = "finanzar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "multipart", "rustls-tls"] }
rand = "0.8"
thiserror = "2"
log = "0.4"

[features]
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
